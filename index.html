<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dust &amp; Redemption</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="loading">
    <div class="paper">
      <div class="logo"><span class="l1">DUST</span><span class="amp">&amp;</span><span class="l2">REDEMPTION</span></div>
      <div class="sub">Cedar Valley · Colorado Territory · 1899</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="status">Surveying the territory…</div>
      <div class="tip">Hold <b>Shift</b> to drive your horse into a gallop. Press <b>Q</b> to slow time with Dead Eye.</div>
    </div>
  </div>
  <div id="title">
    <div class="logo"><span class="l1">DUST</span><span class="amp">&amp;</span><span class="l2">REDEMPTION</span></div>
    <div class="press">Click to ride</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
