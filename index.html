<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0e" />
    <meta name="description" content="STILLWILD — an open-world survival-adventure in a land that forgot how to end." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%235ff2d6' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%235ff2d6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>STILLWILD</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="STILLWILD game view"></canvas>
      <div id="ui-root"></div>
      <section id="loading" aria-live="polite">
        <div class="loading-inner">
          <div class="loading-crest" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="44" />
              <circle cx="60" cy="60" r="30" />
              <path d="M60 8 L60 30 M60 90 L60 112 M8 60 L30 60 M90 60 L112 60" />
            </svg>
          </div>
          <h1 class="loading-title">STILLWILD</h1>
          <p class="loading-tagline">A land that forgot how to end.</p>
          <div class="loading-bar"><div id="loading-fill"></div></div>
          <p id="loading-stage">Preparing…</p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
